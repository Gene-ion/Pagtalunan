<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Hush</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-root="../" data-page="login">
<nav id="nav"></nav>
<main>
  <h1>Log in</h1>
  <form id="form" class="box">
    <label for="username">Username</label><input id="username" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <p id="error" class="error"></p>
    <button>Log in</button>
  </form>
  <p>No account yet? <a href="signup.html">Sign up</a></p>
</main>
<script src="../src/js/main.js"></script>
</body>
</html>
