<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy - Hush</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-root="../" data-page="privacy">
<nav id="nav"></nav>
<main>
  <h1>Privacy settings</h1>
  <form id="form" class="box">
    <div class="checkbox"><input type="checkbox" id="hide"><label for="hide" style="margin:0">Hide my profile from other users</label></div>
    <button>Save</button>
    <p id="msg" class="meta"></p>
  </form>
  <div class="box">
    <h2>Delete account</h2>
    <p>Removes your account and every post you made from this browser.</p>
    <button id="delete" style="background:#b00020">Delete my account</button>
  </div>
</main>
<script src="../src/js/main.js"></script>
</body>
</html>
